name: Build ACE-Step worker

# Builds the RunPod serverless worker image and pushes it to GitHub's
# container registry (ghcr.io). Runs on GitHub's machines, so no local
# Docker install is needed.

on:
  push:
    paths:
      - 'runpod-worker/**'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # ghcr.io rejects uppercase characters in image names, and GitHub
      # usernames may contain them.
      - name: Compute the image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-worker" >> "$GITHUB_OUTPUT"

      # The CUDA base image plus PyTorch does not fit in the default free
      # space on a GitHub runner. This reclaims roughly 30GB.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./runpod-worker
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the image name
        run: |
          echo "Image pushed:"
          echo "  ${{ steps.image.outputs.name }}:latest"
